org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.44 부터 AGP 의 built-in Kotlin / new DSL 이 기본 후보가 됐다.
# 마이그레이터가 기존 프로젝트를 그대로 빌드되게 하려고 이 두 값을 자동으로 넣는다
# (안 넣으면 `flutter build` 가 매번 다시 써서 트리가 더러워진다).
# 켤 준비가 되면 settings.gradle.kts 의 KGP 선언 제거 + AGP 9 대응이 함께 필요하다.
android.builtInKotlin=false
android.newDsl=false
