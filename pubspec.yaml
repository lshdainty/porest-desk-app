name: porest_desk_app
description: "Porest Desk mobile app — Flutter (iOS+Android)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # 라우팅
  go_router: ^17.2.3

  # HTTP / 쿠키 / 인증
  dio: ^5.9.2
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  path_provider: ^2.1.5
  webview_flutter: ^4.13.1
  # SSO OAuth2 로그인용 인앱 WebView — 커스텀스킴(porestdesk://) 가로채기를
  # shouldOverrideUrlLoading 으로 iOS·Android 양쪽 확실히 지원 (system 브라우저 대체).
  # PKCE code_challenge(S256) / state 생성용 sha256.
  crypto: ^3.0.7
  # 토큰/쿠키 암호화 저장 (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.2.4

  # 모델
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # 로컬 저장 / 포맷
  shared_preferences: ^2.5.5
  intl: ^0.20.2

  # UI
  fl_chart: ^1.2.0
  table_calendar: ^3.2.0
  lucide_icons_flutter: ^3.1.15

  # 기타
  connectivity_plus: ^7.1.1
  logger: ^2.7.0
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  # OAuth 콜백 딥링크 수신 (시스템 브라우저 로그인 복귀)
  app_links: ^6.4.1
  open_filex: ^4.7.0
  local_auth: ^3.0.2
  local_auth_android: ^2.0.8
  local_auth_darwin: ^2.0.3
  flutter_slidable: ^4.0.3
  flutter_local_notifications: ^22.3.0
  workmanager: ^0.10.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 코드 생성
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
