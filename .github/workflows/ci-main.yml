name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  # 손으로 돌릴 수 있게 열어 둔다. 머지했는데 실행이 안 잡히는 일이 실제로 있었고
  # (2026-08-07 Actions 장애 — push 이벤트가 통째로 유실됐다) 그때 다시 굴릴 방법이
  # 아무것도 없었다. 빌드만 다시 뽑고 싶을 때도 쓴다.
  # ref 로 main 을 고르면 dev, 태그를 고르면 그 태그로 운영 빌드가 나간다.
  workflow_dispatch:

# contents: 릴리스에 APK·IPA 를 붙인다. checks/pull-requests: 테스트 결과를 체크와
# PR 주석으로 남긴다(다른 porest 백엔드와 같은 구성).
# 서버로는 아무것도 밀지 않는다 — Jenkins 가 릴리스에서 가져간다.
permissions:
  contents: write
  checks: write
  pull-requests: write

env:
  # 로컬(.fvmrc)과 같은 버전으로 못 박는다. CI 만 최신 stable 을 쓰면 SDK 가 올라갈
  # 때마다 로컬은 통과하는데 CI 만 깨진다(deprecation info 도 analyze 를 실패시킨다).
  # SDK 를 올릴 때는 이 값과 .fvmrc 를 함께 바꾼다.
  FLUTTER_VERSION: 3.41.9

jobs:
  # ── 검증 — PR·푸시 모두. 여기서 막히면 빌드도 배포도 안 간다.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze lib/

      # --machine 은 결과를 JSON 으로 뱉는다. 사람이 읽을 로그는 아래 발행 단계가
      # 대신 만들어 주고, 실패 판정은 여기 종료 코드가 그대로 한다.
      - name: Test
        run: flutter test --machine --coverage > test-machine.json

      # 아래 셋은 테스트가 깨져도 돌아야 한다(if: always()). 깨졌을 때가 결과를
      # 가장 보고 싶은 때다.
      - name: Convert test results
        if: always()
        run: |
          dart pub global activate junitreport
          "$HOME/.pub-cache/bin/tojunit" --input test-machine.json --output test-results.xml

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml

      - name: If the test fails, register a check comment in the failed code line
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: test-results.xml
          token: ${{ github.token }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  # ── 버전 — 한 곳에서 정해 두 빌드가 같은 값을 쓴다.
  #
  #    개발  git describe 그대로: 태그-이후커밋수-해시 (1.9.2-3-g1a2b3c4)
  #    운영  태그만: 1.9.3
  #
  #    다른 porest 레포도 Jenkins 가 git describe 를 APP_VERSION 으로 주입한다.
  #    pubspec 의 version 은 더 쓰지 않는다 — 손으로 올려 줘야 해서 늘 뒤처졌다.
  #
  #    아래 네 잡은 PR 만 아니면 돈다(`!= 'pull_request'`). `== 'push'` 로 못 박으면
  #    수동 실행 때 검증만 하고 빌드·배포를 통째로 건너뛴다 — 손으로 돌리는 이유가
  #    바로 그 빌드라서 조건을 뒤집어 적는다.
  version:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      ios: ${{ steps.v.outputs.ios }}
      build: ${{ steps.v.outputs.build }}
      config: ${{ steps.v.outputs.config }}
    steps:
      - uses: actions/checkout@v4
        # describe 가 직전 태그를 찾으려면 태그 이력이 다 있어야 한다.
        with: { fetch-depth: 0 }
      - id: v
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            IOS="${NAME}"
            CONFIG=prod
          else
            NAME="$(git describe --tags --match 'v*' --always)"
            NAME="${NAME#v}"
            # iOS 의 CFBundleShortVersionString 은 숫자 마디만 받는다. describe 문자열을
            # 넣으면 설치 단계에서 튕기므로 앱 안 버전은 직전 태그의 숫자만 쓴다.
            IOS="$(git tag -l 'v*' --sort=-creatordate | head -1)"
            IOS="${IOS#v}"
            IOS="${IOS:-0.0.0}"
            CONFIG=dev
          fi
          # versionCode 는 단조 증가해야 재설치 없이 업데이트된다.
          # run_number 는 레포 전역으로 늘어나므로 dev/prod 가 섞여도 역전이 없다.
          {
            echo "name=${NAME}"
            echo "ios=${IOS}"
            echo "build=${GITHUB_RUN_NUMBER}"
            echo "config=${CONFIG}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::${CONFIG} ${NAME} (iOS ${IOS}, build ${GITHUB_RUN_NUMBER})"

  # ── 안드로이드 APK — 서명 키가 Secrets 에 있으면 릴리스 키로, 없으면 디버그 키 폴백.
  #    (android/app/build.gradle.kts 가 key.properties 유무로 갈라 준다)
  build-android:
    needs: [ verify, version ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 키가 없으면 key.properties 를 안 만든다 — build.gradle.kts 가 디버그 키로 폴백해
      # 빌드는 그대로 된다. Secrets 를 채우는 순간부터 릴리스 키 서명으로 바뀐다.
      # (`if:` 에서는 secrets 컨텍스트를 못 읽어서 스크립트 안에서 가른다)
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::notice::서명 키가 없어 디버그 키로 빌드합니다. 배포용은 Secrets 를 채우세요."
            exit 0
          fi
          echo "${KEYSTORE_B64}" | base64 -d > android/app/porest-desk.jks
          cat > android/key.properties <<EOF
          storeFile=porest-desk.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - run: flutter pub get
      - name: Build APK
        env:
          NAME: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.build }}
          CONFIG: ${{ needs.version.outputs.config }}
        run: |
          set -euo pipefail
          # 안드로이드 versionName 은 형식 제약이 없어 describe 문자열을 그대로 쓴다.
          flutter build apk --release \
            --split-per-abi --target-platform android-arm64 \
            --build-name "${NAME}" \
            --build-number "${BUILD}" \
            --dart-define-from-file="config/${CONFIG}.json"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "porest-desk-${NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: porest-desk-*.apk
          retention-days: 7

  # ── iOS — 서명 없이 빌드해 IPA 로 감싼다.
  #    받는 사람이 자기 Apple ID 로 서명해 넣는 용도(AltStore/Sideloadly).
  build-ios:
    needs: [ verify, version ]
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned IPA
        env:
          NAME: ${{ needs.version.outputs.name }}
          IOS_VERSION: ${{ needs.version.outputs.ios }}
          BUILD: ${{ needs.version.outputs.build }}
          CONFIG: ${{ needs.version.outputs.config }}
        run: |
          set -euo pipefail
          # 앱 안 버전은 숫자만(CFBundleShortVersionString 제약), 파일명은 안드로이드와
          # 같은 이름을 쓴다. 어느 빌드에서 나온 IPA 인지는 파일명으로 따라간다.
          flutter build ios --release --no-codesign \
            --build-name "${IOS_VERSION}" --build-number "${BUILD}" \
            --dart-define-from-file="config/${CONFIG}.json"
          # .app 을 Payload/ 로 감싸면 사이드로딩 도구가 읽는 IPA 가 된다.
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "porest-desk-${NAME}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: porest-desk-*.ipa
          retention-days: 7

  # ── 릴리스 + Jenkins 호출
  #
  #    빌드 결과를 GitHub Release 에 붙이고 Jenkins 에 알리기만 한다. 서버로 파일을
  #    밀지 않으므로 여기엔 서버 접속 정보가 없다 — 배포는 Jenkins 가 가져가서 한다.
  #    (다른 porest 레포와 같은 방식. 운영 반영 승인도 Jenkins 한 곳에서 누른다)
  #
  #    Actions artifact 는 공개 레포라도 받으려면 토큰이 필요하지만 Release 는 아니다.
  #    그래서 artifact 가 아니라 Release 로 넘긴다. 7일 만료도 없어진다.
  release:
    needs: [ version, build-android, build-ios ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
      # AltStore 소스에 적을 주소를 config 에서 읽으려면 어느 config 인지 알아야 한다.
      CONFIG: ${{ needs.version.outputs.config }}
      # IPA 안에 실제로 박히는 버전. AltStore 가 이 값을 대조하므로 소스에도 그대로 적는다.
      IOS_VERSION: ${{ needs.version.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        # 직전 버전 태그를 찾아 릴리스 노트 범위를 잡으려면 태그 이력이 다 있어야 한다.
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist }

      - name: Stage files
        run: |
          set -euo pipefail
          # 태그 푸시는 그 태그로 정식 릴리스, main 푸시는 굴러가는 dev 프리릴리스.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "CHANNEL=prod"           >> "$GITHUB_ENV"
          else
            echo "TAG=dev"   >> "$GITHUB_ENV"
            echo "CHANNEL=dev" >> "$GITHUB_ENV"
          fi
          mkdir -p upload
          # 다운로드 잡이 아티팩트를 이름별 폴더로 풀어 둔다.
          cp dist/android-apk/*.apk "upload/porest-desk-${VERSION}.apk"
          cp dist/ios-ipa/*.ipa     "upload/porest-desk-${VERSION}.ipa"

      - name: Write version.json
        run: |
          set -euo pipefail

          # 변경 내용 — 안드로이드가 업데이트 화면에 그대로 띄운다.
          #
          # GitHub 의 자동 생성 노트는 PR 제목을 모은다. 이 레포는 토픽 브랜치를 로컬에서
          # --no-ff 로 머지해 PR 이 거의 없어서, 그걸 쓰면 Full Changelog 링크 한 줄만
          # 남는다. 커밋 제목을 직접 세는 게 낫다.
          #
          # 직전 v 태그부터 지금까지. dev 는 TAG 가 옛 커밋을 가리키므로 범위 끝을
          # GITHUB_SHA 로 잡는다 — prod 도 태그 커밋이라 같은 식이 통한다.
          #
          # 시작점은 "이 커밋의 조상 중 가장 가까운 v 태그" 여야 한다. 태그 목록을
          # 최신순으로 세어 첫 줄을 쓰면, 옛 태그를 다시 빌드할 때 자기보다 나중 태그를
          # 기준으로 잡아 범위가 뒤집힌다(v1.10.0 을 재실행하면 PREV 가 v1.10.1 이 된다).
          PREV=$(git describe --tags --match 'v*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          RANGE="${GITHUB_SHA}"
          [ -n "${PREV}" ] && RANGE="${PREV}..${GITHUB_SHA}"

          ALL=$(git log --no-merges --pretty='- %s' ${RANGE} | head -50)
          # 쓰는 사람 눈에 뜻이 있는 것만. ci·docs·test·chore 는 우리 사정이다.
          NOTES=$(printf '%s\n' "${ALL}" | grep -E '^- (feat|fix)' || true)
          # 전부 걸러졌으면 원본을 쓴다 — 빈 화면보다 낫다.
          [ -z "${NOTES}" ] && NOTES="${ALL}"

          # 앱이 새 버전을 알아보는 근거. 웹 다운로드 페이지도 이걸 읽는다.
          #
          # jq 로 만든다 — 노트에 따옴표·개행·백슬래시가 섞여 들어와도 JSON 이 깨지지
          # 않게. 손으로 쓰던 heredoc 은 그걸 못 견딘다.
          jq -n \
            --arg channel "${CHANNEL}" \
            --arg version "${VERSION}" \
            --argjson buildNumber "${BUILD_NUMBER}" \
            --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg android "porest-desk-${VERSION}.apk" \
            --arg ios "porest-desk-${VERSION}.ipa" \
            --arg notes "${NOTES}" \
            '{channel: $channel, version: $version, buildNumber: $buildNumber,
              releasedAt: $releasedAt, android: $android, ios: $ios, notes: $notes}' \
            > upload/version.json
          echo "::notice::version.json (노트 ${#NOTES}자)"

      # AltStore 소스 — iOS 에서 앱을 갱신할 수 있는 유일한 길이다.
      #
      # 아이폰은 스토어 밖에서 앱이 스스로를 업데이트할 수 없다. 브라우저로 IPA 를 열어도
      # 서명이 없어 설치되지 않는다. AltStore 에 이 주소를 소스로 등록해 두면 새 버전을
      # 거기서 받아 깔 수 있고, 무료 계정의 7일 만료도 AltServer 가 알아서 갱신한다.
      #
      # 주소는 채널을 따라간다. dev 빌드가 만든 소스가 운영 IPA 를 가리키면 받는 쪽은
      # 404 만 본다 — dev·prod 가 서로 다른 호스트에 있으니 여기서 갈라야 한다.
      # 도메인을 여기 또 적지 않고 config/*.json 을 읽는다. 앱이 API 주소로 쓰는 그 값이라
      # 한쪽만 바뀌어 어긋나는 일이 없다.
      - name: Write altstore.json
        run: |
          set -euo pipefail
          IPA="upload/porest-desk-${VERSION}.ipa"
          # size 는 필수 필드다. 틀리면 AltStore 가 내려받기 전에 실패한다.
          SIZE=$(stat -c%s "${IPA}")
          WEB_BASE=$(jq -er '.WEB_BASE_URL' "config/${CONFIG}.json")

          # 두 소스를 나란히 등록해 두고 쓸 수 있게 채널마다 이름과 식별자를 다르게 준다.
          #
          # identifier 를 같이 두면 AltStore 가 둘을 같은 소스로 보고 나중에 넣은 쪽이
          # 앞의 것을 밀어낸다 — 이름만 갈라서는 부족하다.
          #
          # bundleIdentifier 는 그대로다. 설치는 그 값으로 판정되므로 dev·prod 는 여전히
          # 한 번에 하나만 깔리고 서로 덮어쓴다(그렇게 쓰기로 한 구조다). 여기서 가르는
          # 것은 목록에서 어느 쪽인지 알아보는 용도뿐이다.
          if [ "${CONFIG}" = "dev" ]; then
            SOURCE_NAME="Porest (dev)"
            SOURCE_ID="cloud.porest.altstore.dev"
            APP_NAME="Porest Desk (dev)"
            APP_SUBTITLE="개발 서버 — 시험용 빌드"
          else
            SOURCE_NAME="Porest"
            SOURCE_ID="cloud.porest.altstore"
            APP_NAME="Porest Desk"
            APP_SUBTITLE="가계부·자산·할일을 한곳에서"
          fi

          # 스킴은 faq.altstore.io/developers/make-a-source 기준.
          # appPermissions 는 비어 있어도 키 자체는 있어야 한다.
          #
          # version 은 IPA 의 CFBundleShortVersionString 과 글자까지 같아야 한다. 다르면
          # AltStore 가 다 받아 놓고 "does not match the version specified by the source"
          # 로 되돌린다. iOS 는 이 필드에 숫자 마디만 받아서 IPA 에는 직전 태그의 숫자만
          # 들어간다 — describe 문자열(1.9.2-50-g6f4a880)은 여기 쓸 수 없다.
          # 그 문자열은 표시 전용인 marketingVersion 으로 넘긴다.
          cat > upload/altstore.json <<JSON
          {
            "name": "${SOURCE_NAME}",
            "identifier": "${SOURCE_ID}",
            "subtitle": "포레스트 데스크",
            "iconURL": "${WEB_BASE}/app-icon.png",
            "tintColor": "0147AD",
            "apps": [
              {
                "name": "${APP_NAME}",
                "bundleIdentifier": "com.porest.desk.porestDeskApp",
                "developerName": "Porest",
                "subtitle": "${APP_SUBTITLE}",
                "localizedDescription": "가계부와 자산, 할일을 한곳에서 관리하는 개인용 앱입니다.",
                "iconURL": "${WEB_BASE}/app-icon.png",
                "tintColor": "0147AD",
                "category": "finance",
                "versions": [
                  {
                    "version": "${IOS_VERSION}",
                    "buildVersion": "${BUILD_NUMBER}",
                    "marketingVersion": "${VERSION}",
                    "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "downloadURL": "${WEB_BASE}/download/porest-desk-${VERSION}.ipa",
                    "size": ${SIZE},
                    "minOSVersion": "13.0"
                  }
                ],
                "appPermissions": { "entitlements": [], "privacy": {} }
              }
            ],
            "news": []
          }
          JSON
          # 문법이 깨지면 AltStore 는 소스를 통째로 무시한다 — 조용히 안 되는 게 제일 나쁘다.
          python3 -m json.tool upload/altstore.json > /dev/null
          echo "::notice::altstore.json (${VERSION}, build ${BUILD_NUMBER}, ${SIZE} bytes)"

      - name: Publish release
        run: |
          set -euo pipefail
          # dev 는 태그를 재사용한다 — 지웠다 다시 만들어 항상 최신 하나만 남긴다.
          if [ "${CHANNEL}" = "dev" ]; then
            gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
            gh release create "${TAG}" upload/* --prerelease \
              --title "dev (build ${BUILD_NUMBER})" \
              --notes "main ${GITHUB_SHA:0:7} 자동 빌드. 운영 배포용이 아니다."
          else
            # 노트는 그 사이 머지된 PR 제목으로 GitHub 이 채운다. 다만 시작점을 직접
            # 준다 — 안 주면 직전 릴리스인 dev 프리릴리스를 기준으로 잡아 버린다.
            #
            # 조상 중 가장 가까운 태그를 찾는다. 목록을 최신순으로 세면 옛 태그를 다시
            # 빌드할 때 자기보다 나중 태그가 시작점이 돼 범위가 뒤집힌다.
            PREV=$(git describe --tags --match 'v*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
            NOTES=(--generate-notes)
            [ -n "${PREV}" ] && NOTES+=(--notes-start-tag "${PREV}")
            # 재실행 대비 — 릴리스가 이미 있으면 파일만 덮어쓴다.
            gh release create "${TAG}" upload/* --title "${TAG}" "${NOTES[@]}" \
              || gh release upload "${TAG}" upload/* --clobber
          fi

      # Jenkins 가 릴리스를 가져가 서버에 놓는다. prod 는 Jenkins 에서 승인을 눌러야 진행된다.
      # JENKINS_URL 이 비어 있으면 조용히 건너뛴다 — 도입 초기에 CI 가 빨간불이 되지 않게.
      - name: Trigger Jenkins Deploy
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
        run: |
          set -euo pipefail
          # 시크릿에 줄바꿈이나 공백이 딸려 오면 curl 이 URL 을 못 읽는다(exit 3).
          # 값이 마스킹돼 로그로는 안 보이니 여기서 털어 낸다.
          BASE="$(printf '%s' "${JENKINS_URL}" | tr -d '[:space:]')"
          BASE="${BASE%/}"
          if [ -z "${BASE}" ]; then
            echo "::notice::JENKINS_URL 이 없어 배포 호출을 건너뜁니다. 릴리스 ${TAG} 는 올라갔습니다."
            exit 0
          fi
          case "${BASE}" in
            http://*|https://*) ;;
            *) echo "::error::JENKINS_URL 은 http:// 또는 https:// 로 시작해야 합니다."; exit 1 ;;
          esac
          # job 은 하나다 — dev/prod 는 본문의 channel 로 갈린다(다른 porest 레포와 같은 방식).
          #
          # -f 가 없으면 404·500 에도 curl 이 0 을 돌려준다. 토큰을 틀리게 적어도 초록불이
          # 뜨고 배포는 안 되는 상태가 되므로, HTTP 오류를 실패로 받는다.
          # -S 는 -s 와 같이 쓰면 진행률은 감추고 오류 메시지만 남긴다.
          curl -fsS -X POST "${BASE}/generic-webhook-trigger/invoke?token=porest-desk-app-deploy" \
            -H 'Content-Type: application/json' \
            -d "{\"channel\":\"${CHANNEL}\",\"version\":\"${VERSION}\",\"tag\":\"${TAG}\",\"buildNumber\":${BUILD_NUMBER}}"
