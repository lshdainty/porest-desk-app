name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]

# 릴리스에 APK·IPA 를 붙이려면 contents: write 가 필요하다.
# 서버로는 아무것도 밀지 않는다 — Jenkins 가 릴리스에서 가져간다.
permissions:
  contents: write

env:
  # 로컬(.fvmrc)과 같은 버전으로 못 박는다. CI 만 최신 stable 을 쓰면 SDK 가 올라갈
  # 때마다 로컬은 통과하는데 CI 만 깨진다(deprecation info 도 analyze 를 실패시킨다).
  # SDK 를 올릴 때는 이 값과 .fvmrc 를 함께 바꾼다.
  FLUTTER_VERSION: 3.41.9

jobs:
  # ── 검증 — PR·푸시 모두. 여기서 막히면 빌드도 배포도 안 간다.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze lib/
      - name: Test
        run: flutter test

  # ── 버전 — 한 곳에서 정해 두 빌드가 같은 값을 쓴다.
  #
  #    개발  git describe 그대로: 태그-이후커밋수-해시 (1.9.2-3-g1a2b3c4)
  #    운영  태그만: 1.9.3
  #
  #    다른 porest 레포도 Jenkins 가 git describe 를 APP_VERSION 으로 주입한다.
  #    pubspec 의 version 은 더 쓰지 않는다 — 손으로 올려 줘야 해서 늘 뒤처졌다.
  version:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      ios: ${{ steps.v.outputs.ios }}
      build: ${{ steps.v.outputs.build }}
      config: ${{ steps.v.outputs.config }}
    steps:
      - uses: actions/checkout@v4
        # describe 가 직전 태그를 찾으려면 태그 이력이 다 있어야 한다.
        with: { fetch-depth: 0 }
      - id: v
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            IOS="${NAME}"
            CONFIG=prod
          else
            NAME="$(git describe --tags --match 'v*' --always)"
            NAME="${NAME#v}"
            # iOS 의 CFBundleShortVersionString 은 숫자 마디만 받는다. describe 문자열을
            # 넣으면 설치 단계에서 튕기므로 앱 안 버전은 직전 태그의 숫자만 쓴다.
            IOS="$(git tag -l 'v*' --sort=-creatordate | head -1)"
            IOS="${IOS#v}"
            IOS="${IOS:-0.0.0}"
            CONFIG=dev
          fi
          # versionCode 는 단조 증가해야 재설치 없이 업데이트된다.
          # run_number 는 레포 전역으로 늘어나므로 dev/prod 가 섞여도 역전이 없다.
          {
            echo "name=${NAME}"
            echo "ios=${IOS}"
            echo "build=${GITHUB_RUN_NUMBER}"
            echo "config=${CONFIG}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::${CONFIG} ${NAME} (iOS ${IOS}, build ${GITHUB_RUN_NUMBER})"

  # ── 안드로이드 APK — 서명 키가 Secrets 에 있으면 릴리스 키로, 없으면 디버그 키 폴백.
  #    (android/app/build.gradle.kts 가 key.properties 유무로 갈라 준다)
  build-android:
    needs: [ verify, version ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 키가 없으면 key.properties 를 안 만든다 — build.gradle.kts 가 디버그 키로 폴백해
      # 빌드는 그대로 된다. Secrets 를 채우는 순간부터 릴리스 키 서명으로 바뀐다.
      # (`if:` 에서는 secrets 컨텍스트를 못 읽어서 스크립트 안에서 가른다)
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::notice::서명 키가 없어 디버그 키로 빌드합니다. 배포용은 Secrets 를 채우세요."
            exit 0
          fi
          echo "${KEYSTORE_B64}" | base64 -d > android/app/porest-desk.jks
          cat > android/key.properties <<EOF
          storeFile=porest-desk.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - run: flutter pub get
      - name: Build APK
        env:
          NAME: ${{ needs.version.outputs.name }}
          BUILD: ${{ needs.version.outputs.build }}
          CONFIG: ${{ needs.version.outputs.config }}
        run: |
          set -euo pipefail
          # 안드로이드 versionName 은 형식 제약이 없어 describe 문자열을 그대로 쓴다.
          flutter build apk --release \
            --split-per-abi --target-platform android-arm64 \
            --build-name "${NAME}" \
            --build-number "${BUILD}" \
            --dart-define-from-file="config/${CONFIG}.json"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "porest-desk-${NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: porest-desk-*.apk
          retention-days: 7

  # ── iOS — 서명 없이 빌드해 IPA 로 감싼다.
  #    받는 사람이 자기 Apple ID 로 서명해 넣는 용도(AltStore/Sideloadly).
  build-ios:
    needs: [ verify, version ]
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned IPA
        env:
          NAME: ${{ needs.version.outputs.name }}
          IOS_VERSION: ${{ needs.version.outputs.ios }}
          BUILD: ${{ needs.version.outputs.build }}
          CONFIG: ${{ needs.version.outputs.config }}
        run: |
          set -euo pipefail
          # 앱 안 버전은 숫자만(CFBundleShortVersionString 제약), 파일명은 안드로이드와
          # 같은 이름을 쓴다. 어느 빌드에서 나온 IPA 인지는 파일명으로 따라간다.
          flutter build ios --release --no-codesign \
            --build-name "${IOS_VERSION}" --build-number "${BUILD}" \
            --dart-define-from-file="config/${CONFIG}.json"
          # .app 을 Payload/ 로 감싸면 사이드로딩 도구가 읽는 IPA 가 된다.
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "porest-desk-${NAME}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: porest-desk-*.ipa
          retention-days: 7

  # ── 릴리스 + Jenkins 호출
  #
  #    빌드 결과를 GitHub Release 에 붙이고 Jenkins 에 알리기만 한다. 서버로 파일을
  #    밀지 않으므로 여기엔 서버 접속 정보가 없다 — 배포는 Jenkins 가 가져가서 한다.
  #    (다른 porest 레포와 같은 방식. 운영 반영 승인도 Jenkins 한 곳에서 누른다)
  #
  #    Actions artifact 는 공개 레포라도 받으려면 토큰이 필요하지만 Release 는 아니다.
  #    그래서 artifact 가 아니라 Release 로 넘긴다. 7일 만료도 없어진다.
  release:
    needs: [ version, build-android, build-ios ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        # 직전 버전 태그를 찾아 릴리스 노트 범위를 잡으려면 태그 이력이 다 있어야 한다.
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist }

      - name: Stage files
        run: |
          set -euo pipefail
          # 태그 푸시는 그 태그로 정식 릴리스, main 푸시는 굴러가는 dev 프리릴리스.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "CHANNEL=prod"           >> "$GITHUB_ENV"
          else
            echo "TAG=dev"   >> "$GITHUB_ENV"
            echo "CHANNEL=dev" >> "$GITHUB_ENV"
          fi
          mkdir -p upload
          # 다운로드 잡이 아티팩트를 이름별 폴더로 풀어 둔다.
          cp dist/android-apk/*.apk "upload/porest-desk-${VERSION}.apk"
          cp dist/ios-ipa/*.ipa     "upload/porest-desk-${VERSION}.ipa"

      - name: Write version.json
        run: |
          set -euo pipefail
          # 앱이 새 버전을 알아보는 근거. 웹 다운로드 페이지도 이걸 읽는다.
          cat > upload/version.json <<JSON
          {
            "channel": "${CHANNEL}",
            "version": "${VERSION}",
            "buildNumber": ${BUILD_NUMBER},
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "android": "porest-desk-${VERSION}.apk",
            "ios": "porest-desk-${VERSION}.ipa"
          }
          JSON

      - name: Publish release
        run: |
          set -euo pipefail
          # dev 는 태그를 재사용한다 — 지웠다 다시 만들어 항상 최신 하나만 남긴다.
          if [ "${CHANNEL}" = "dev" ]; then
            gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
            gh release create "${TAG}" upload/* --prerelease \
              --title "dev (build ${BUILD_NUMBER})" \
              --notes "main ${GITHUB_SHA:0:7} 자동 빌드. 운영 배포용이 아니다."
          else
            # 노트는 그 사이 머지된 PR 제목으로 GitHub 이 채운다. 다만 시작점을 직접
            # 준다 — 안 주면 직전 릴리스인 dev 프리릴리스를 기준으로 잡아 버린다.
            PREV=$(git tag -l 'v*' --sort=-creatordate | grep -vxF "${TAG}" | head -1)
            NOTES=(--generate-notes)
            [ -n "${PREV}" ] && NOTES+=(--notes-start-tag "${PREV}")
            # 재실행 대비 — 릴리스가 이미 있으면 파일만 덮어쓴다.
            gh release create "${TAG}" upload/* --title "${TAG}" "${NOTES[@]}" \
              || gh release upload "${TAG}" upload/* --clobber
          fi

      # Jenkins 가 릴리스를 가져가 서버에 놓는다. prod 는 Jenkins 에서 승인을 눌러야 진행된다.
      # JENKINS_URL 이 비어 있으면 조용히 건너뛴다 — 도입 초기에 CI 가 빨간불이 되지 않게.
      - name: Trigger Jenkins Deploy
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
        run: |
          set -euo pipefail
          # 시크릿에 줄바꿈이나 공백이 딸려 오면 curl 이 URL 을 못 읽는다(exit 3).
          # 값이 마스킹돼 로그로는 안 보이니 여기서 털어 낸다.
          BASE="$(printf '%s' "${JENKINS_URL}" | tr -d '[:space:]')"
          BASE="${BASE%/}"
          if [ -z "${BASE}" ]; then
            echo "::notice::JENKINS_URL 이 없어 배포 호출을 건너뜁니다. 릴리스 ${TAG} 는 올라갔습니다."
            exit 0
          fi
          case "${BASE}" in
            http://*|https://*) ;;
            *) echo "::error::JENKINS_URL 은 http:// 또는 https:// 로 시작해야 합니다."; exit 1 ;;
          esac
          # job 은 하나다 — dev/prod 는 본문의 channel 로 갈린다(다른 porest 레포와 같은 방식).
          #
          # -f 가 없으면 404·500 에도 curl 이 0 을 돌려준다. 토큰을 틀리게 적어도 초록불이
          # 뜨고 배포는 안 되는 상태가 되므로, HTTP 오류를 실패로 받는다.
          # -S 는 -s 와 같이 쓰면 진행률은 감추고 오류 메시지만 남긴다.
          curl -fsS -X POST "${BASE}/generic-webhook-trigger/invoke?token=porest-desk-app-deploy" \
            -H 'Content-Type: application/json' \
            -d "{\"channel\":\"${CHANNEL}\",\"version\":\"${VERSION}\",\"tag\":\"${TAG}\",\"buildNumber\":${BUILD_NUMBER}}"
