name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]

# 릴리스에 APK·IPA 를 붙이려면 contents: write 가 필요하다.
# 서버로는 아무것도 밀지 않는다 — Jenkins 가 릴리스에서 가져간다.
permissions:
  contents: write

env:
  # 로컬(.fvmrc)과 같은 버전으로 못 박는다. CI 만 최신 stable 을 쓰면 SDK 가 올라갈
  # 때마다 로컬은 통과하는데 CI 만 깨진다(deprecation info 도 analyze 를 실패시킨다).
  # SDK 를 올릴 때는 이 값과 .fvmrc 를 함께 바꾼다.
  FLUTTER_VERSION: 3.41.9

jobs:
  # ── 검증 — PR·푸시 모두. 여기서 막히면 빌드도 배포도 안 간다.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze lib/
      - name: Test
        run: flutter test

  # ── 안드로이드 APK — 서명 키가 Secrets 에 있으면 릴리스 키로, 없으면 디버그 키 폴백.
  #    (android/app/build.gradle.kts 가 key.properties 유무로 갈라 준다)
  build-android:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_number: ${{ steps.ver.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve version
        id: ver
        run: |
          # 태그 배포는 태그가 곧 버전, 그 밖에는 pubspec 의 버전을 쓴다.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          fi
          # versionCode 는 단조 증가해야 재설치 없이 업데이트된다.
          # run_number 는 레포 전역으로 늘어나므로 dev/prod 가 섞여도 역전이 없다.
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # 키가 없으면 key.properties 를 안 만든다 — build.gradle.kts 가 디버그 키로 폴백해
      # 빌드는 그대로 된다. Secrets 를 채우는 순간부터 릴리스 키 서명으로 바뀐다.
      # (`if:` 에서는 secrets 컨텍스트를 못 읽어서 스크립트 안에서 가른다)
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::notice::서명 키가 없어 디버그 키로 빌드합니다. 배포용은 Secrets 를 채우세요."
            exit 0
          fi
          echo "${KEYSTORE_B64}" | base64 -d > android/app/porest-desk.jks
          cat > android/key.properties <<EOF
          storeFile=porest-desk.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - run: flutter pub get
      - name: Build APK
        run: |
          flutter build apk --release \
            --split-per-abi --target-platform android-arm64 \
            --build-name '${{ steps.ver.outputs.version }}' \
            --build-number '${{ steps.ver.outputs.build_number }}' \
            --dart-define-from-file=config/${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev' }}.json
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             porest-desk-${{ steps.ver.outputs.version }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: porest-desk-*.apk
          retention-days: 7

  # ── iOS — 서명 없이 빌드해 IPA 로 감싼다.
  #    받는 사람이 자기 Apple ID 로 서명해 넣는 용도(AltStore/Sideloadly).
  build-ios:
    needs: verify
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned IPA
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; CONFIG=prod
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1); CONFIG=dev
          fi
          flutter build ios --release --no-codesign \
            --build-name "$VERSION" --build-number "${GITHUB_RUN_NUMBER}" \
            --dart-define-from-file=config/${CONFIG}.json
          # .app 을 Payload/ 로 감싸면 사이드로딩 도구가 읽는 IPA 가 된다.
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "porest-desk-${VERSION}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: porest-desk-*.ipa
          retention-days: 7

  # ── 릴리스 + Jenkins 호출
  #
  #    빌드 결과를 GitHub Release 에 붙이고 Jenkins 에 알리기만 한다. 서버로 파일을
  #    밀지 않으므로 여기엔 서버 접속 정보가 없다 — 배포는 Jenkins 가 가져가서 한다.
  #    (다른 porest 레포와 같은 방식. 운영 반영 승인도 Jenkins 한 곳에서 누른다)
  #
  #    Actions artifact 는 공개 레포라도 받으려면 토큰이 필요하지만 Release 는 아니다.
  #    그래서 artifact 가 아니라 Release 로 넘긴다. 7일 만료도 없어진다.
  release:
    needs: [ build-android, build-ios ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build-android.outputs.version }}
      BUILD_NUMBER: ${{ needs.build-android.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }

      - name: Stage files
        run: |
          set -euo pipefail
          # 태그 푸시는 그 태그로 정식 릴리스, main 푸시는 굴러가는 dev 프리릴리스.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "CHANNEL=prod"           >> "$GITHUB_ENV"
          else
            echo "TAG=dev"   >> "$GITHUB_ENV"
            echo "CHANNEL=dev" >> "$GITHUB_ENV"
          fi
          mkdir -p upload
          # 다운로드 잡이 아티팩트를 이름별 폴더로 풀어 둔다.
          cp dist/android-apk/*.apk "upload/porest-desk-${VERSION}.apk"
          cp dist/ios-ipa/*.ipa     "upload/porest-desk-${VERSION}.ipa"

      - name: Write version.json
        run: |
          set -euo pipefail
          # 앱이 새 버전을 알아보는 근거. 웹 다운로드 페이지도 이걸 읽는다.
          cat > upload/version.json <<JSON
          {
            "channel": "${CHANNEL}",
            "version": "${VERSION}",
            "buildNumber": ${BUILD_NUMBER},
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "android": "porest-desk-${VERSION}.apk",
            "ios": "porest-desk-${VERSION}.ipa"
          }
          JSON

      - name: Publish release
        run: |
          set -euo pipefail
          # dev 는 태그를 재사용한다 — 지웠다 다시 만들어 항상 최신 하나만 남긴다.
          if [ "${CHANNEL}" = "dev" ]; then
            gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
            gh release create "${TAG}" upload/* --prerelease \
              --title "dev (build ${BUILD_NUMBER})" \
              --notes "main ${GITHUB_SHA:0:7} 자동 빌드. 운영 배포용이 아니다."
          else
            # 재실행 대비 — 릴리스가 이미 있으면 파일만 덮어쓴다.
            gh release create "${TAG}" upload/* \
              --title "${TAG}" \
              --notes "버전 ${VERSION} (build ${BUILD_NUMBER})" \
              || gh release upload "${TAG}" upload/* --clobber
          fi

      # Jenkins 가 릴리스를 가져가 서버에 놓는다. prod 는 Jenkins 에서 승인을 눌러야 진행된다.
      # JENKINS_URL 이 비어 있으면 조용히 건너뛴다 — 도입 초기에 CI 가 빨간불이 되지 않게.
      - name: Trigger Jenkins Deploy
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${JENKINS_URL}" ]; then
            echo "::notice::JENKINS_URL 이 없어 배포 호출을 건너뜁니다. 릴리스 ${TAG} 는 올라갔습니다."
            exit 0
          fi
          if [ "${CHANNEL}" = "prod" ]; then TOKEN=porest-desk-app-deploy-prod; else TOKEN=porest-desk-app-deploy; fi
          curl -s -X POST "${JENKINS_URL}/generic-webhook-trigger/invoke?token=${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"channel\":\"${CHANNEL}\",\"version\":\"${VERSION}\",\"tag\":\"${TAG}\",\"buildNumber\":${BUILD_NUMBER}}"
